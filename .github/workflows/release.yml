name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # 仅匹配 vX.X.X（不含 -suffix，避免误触发）
  workflow_dispatch:              # 允许手动触发；只有 tag 会创建 Release

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true   # 示例工程与演示视频走 LFS，不拉取会得到指针文件

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # ffmpeg / ffprobe 各约 95MB，不入库；此处下载后由 extraResources 打进安装包
      - name: Fetch ffmpeg & ffprobe
        run: node scripts/fetch-ffmpeg.js

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Build frontend
        working-directory: frontweb
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend-node
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npm ci

      - name: Install desktop dependencies & rebuild native modules
        working-directory: desktop
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npm ci

      - name: Copy frontend dist
        working-directory: desktop
        run: node scripts/copy-front.js

      - name: Copy backend
        working-directory: desktop
        run: node scripts/copy-backend.js

      # 标准版（含示例项目）
      - name: Build Standard Installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Clean unpacked output
        working-directory: desktop
        run: npm run clean:unpacked

      # Lite 版（不含示例项目）
      - name: Build Lite Installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --config electron-builder-lite.json --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: desktop/release/*.exe
          retention-days: 7

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend-node
        run: npm ci

      - name: Install desktop dependencies & rebuild native modules
        working-directory: desktop
        run: npm ci

      # dist-mac.sh 会按 arm64、x64 各下载一份静态 ffmpeg，再分别打标准版和 Lite。
      # GitHub 的 macos-latest 是 Apple Silicon；x64 依赖 electron-builder 交叉编译。
      - name: Build macOS DMG (arm64 + x64, standard + lite)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bash dist-mac.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: desktop/release/*.dmg
          retention-days: 7

  build-linux:
    name: Build Linux AppImage and deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg xz-utils

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend-node
        run: npm ci

      - name: Install desktop dependencies & rebuild native modules
        working-directory: desktop
        run: npm ci

      - name: Build Linux packages (standard + lite)
        working-directory: desktop
        run: bash dist-linux.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: true   # 先创建草稿，人工审核后手动发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
